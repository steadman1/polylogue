[project]
name = "polylogue"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "fastapi[standard]>=0.128.8",
    "openai",
    "pytest>=8.4.2",
]

[project.scripts]
polylogue = "polylogue:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[tool.ruff.lint]
ignore = ["I001"]

[tool.pytest.ini_options]
pythonpath = ["src"]
